name: Daily IP News Digest

on:
  # 北京时间工作日 05:30 = UTC 21:30（前一天）
  schedule:
    - cron: '30 21 * * 1-5'
  # 支持手动触发
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        run: python scripts/collect.py

      - name: Commit and push data changes
        run: |
          git config user.name "IP News Bot"
          git config user.email "bot@ip-news-hub"
          git add data/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update digest data $(date '+%Y-%m-%d')"
          git push
